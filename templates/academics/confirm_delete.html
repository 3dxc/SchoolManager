{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="form-card text-center">
      <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem;"></i>
      <h5 class="mt-3">Confirmer la suppression</h5>
      <p class="text-muted">Supprimer <strong>{{ object }}</strong> ? Cette action est irréversible.</p>
      <form method="post" class="d-flex gap-2 justify-content-center mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Supprimer</button>
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Annuler</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
