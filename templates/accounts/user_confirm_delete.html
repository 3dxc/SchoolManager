{% extends 'base.html' %}
{% block title %}Supprimer l'utilisateur{% endblock %}
{% block page_title %}Supprimer l'utilisateur{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="form-card text-center">
      <i class="bi bi-person-x-fill text-danger" style="font-size:3rem;"></i>
      <h5 class="mt-3">Supprimer {{ object.get_full_name|default:object.username }} ?</h5>
      <p class="text-muted">Cette action est irréversible.</p>
      <form method="post" class="d-flex gap-2 justify-content-center mt-4">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Supprimer</button>
        <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-secondary">Annuler</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
